---
- name: Creating facts.d directory
  ansible.builtin.file:
    state: directory
    path: /etc/ansible/facts.d
    owner: root
    mode: "0750"
  listen:
    - Save repos
    - Save apps

- name: Saving current apps
  ansible.builtin.copy:
    content: "{{ flatpak_apps | to_json }}"
    dest: /etc/ansible/facts.d/flatpak_apps.fact
    owner: root
    mode: "0640"
  listen: Save apps

- name: Saving current repos
  ansible.builtin.copy:
    content: "{{ flatpak_repos | to_json }}"
    dest: /etc/ansible/facts.d/flatpak_repos.fact
    owner: root
    mode: "0640"
  listen: Save repos
