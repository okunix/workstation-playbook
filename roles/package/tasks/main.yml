---
- name: Installing packages
  ansible.builtin.package:
    name: "{{ item }}"
  loop: "{{ package_install }}"

- name: Removing packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop: "{{ package_remove }}"

- name: Creating facts.d directory
  ansible.builtin.file:
    state: directory
    path: /etc/ansible/facts.d
    owner: root
    mode: "0750"

- name: Saving current state
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/packages.fact
    content: "{{ package_install | to_json }}"
    owner: root
    mode: "0640"
