---
- name: Installing sudo
  become_method: ansible.builtin.su
  become_user: root
  ansible.builtin.package:
    name: sudo

- name: Adding wheel group to sudoers
  become_method: ansible.builtin.su
  become_user: root
  ansible.builtin.lineinfile:
    line: "%wheel ALL = (ALL) ALL"
    path: /etc/sudoers
    validate: visudo -cf %s
